name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Default Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Single Universal Release APK
        run: ./gradlew assembleUniversalGmsRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-v4.4.0-latest
          path: app/build/outputs/apk/universalGms/release/*.apkname: Build Android Release APK

